name: Analyzer - offline validation

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyzer-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks (no imports, models or downloads)
        run: python -m compileall -q app.py analyze.py src scripts
      - name: Parse the JSON contract schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('schemas').glob('*.json'))
          if not paths:
              raise SystemExit('BLOCKED: no JSON schemas found')
          for path in paths:
              content = json.loads(path.read_text(encoding='utf-8-sig'))
              if not isinstance(content, dict):
                  raise ValueError(f'{path}: schema root is not an object')
          print(f'PASS: {len(paths)} JSON schemas parsed (not semantic validation)')
          PY

  pytest-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared CPU runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements/dev.txt pillow
      - name: Exporter synthetic self-test
        run: python exportar_ldporto.py --self-test
      - name: Run offline regression (synthetic fixtures, no real media)
        run: |
          mkdir -p test-results
          python -m pytest src/tests -q --disable-warnings --maxfail=5 --junitxml=test-results/pytest.xml
      - name: Upload test JUnit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-offline-junit
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

# Offline CI is not Windows 11 acceptance or a real-video / GPU / Ollama test.
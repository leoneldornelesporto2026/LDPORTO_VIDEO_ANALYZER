name: Analyzer - offline validation

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyzer-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks (no imports, models or downloads)
        run: python -m compileall -q app.py analyze.py src scripts
      - name: Parse the JSON contract schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('schemas').glob('*.json'))
          if not paths:
              raise SystemExit('BLOCKED: no JSON schemas found')
          for path in paths:
              content = json.loads(path.read_text(encoding='utf-8-sig'))
              if not isinstance(content, dict):
                  raise ValueError(f'{path}: schema root is not an object')
          print(f'PASS: {len(paths)} JSON schemas parsed (not semantic validation)')
          PY

  pytest-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared CPU runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements/dev.txt pillow
      - name: Install FFmpeg for synthetic-video regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Report missing local-only historical ZIP
        shell: bash
        run: |
          if [ ! -f src/tests/fixtures/historical_evidence/CHATGPT_REVIEW.zip ]; then
            echo 'BLOCKED — Historic CHATGPT_REVIEW.zip and SECOND_CURATION_READY.zip are not versioned. Seven exact historical tests are deselected ONLY on this runner. Verify original SHA256 files on Windows; CI must not invent them.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Exporter synthetic self-test
        run: python exportar_ldporto.py --self-test
      - name: Run offline regression (synthetic fixtures, no real media)
        run: |
          mkdir -p test-results
          extra_args=()
          if [ ! -f src/tests/fixtures/historical_evidence/CHATGPT_REVIEW.zip ] || [ ! -f src/tests/fixtures/historical_evidence/SECOND_CURATION_READY.zip ]; then
            # Exact tests requiring two unversioned historical ZIPs. Synthetic tests remain enabled.
            extra_args=(
              --deselect=src/tests/test_historical_fixture_provenance.py::test_relocated_historical_zip_bytes_match_original_provenance
              --deselect=src/tests/test_stage13_explainability.py::test_all_52_historical_candidates_receive_stable_diagnostics
              --deselect=src/tests/test_stage17_editorial_replay.py::test_real_same_52_ids_reproducible_and_unapproved
              --deselect=src/tests/test_stage17_editorial_replay.py::test_mismatched_run_rejected
              --deselect=src/tests/test_stage17_editorial_replay.py::test_missing_upstream_does_not_promote
              --deselect=src/tests/test_stage18_handoff_audit.py::test_real_historical_fixture_hashes_links_and_contact_sheets
              --deselect=src/tests/test_stage19_uncertain_words.py::test_historical_flags_are_not_the_prompt_percentage
            )
          fi
          python -m pytest src/tests -q --disable-warnings --maxfail=10 --junitxml=test-results/pytest.xml "${extra_args[@]}"
      - name: Upload test JUnit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-offline-junit
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

# Offline CI is not Windows 11 acceptance or a real-video / GPU / Ollama test.
# Configuração local. Nunca coloque token HF aqui.
language: pt
device: auto
compute_type: auto
offline: false
strict: false

# Generated by GitHub Copilot - Oct-05-2026
preflight:
  allow_self_repair: false
  network_timeout_seconds: 5
  repair_timeout_seconds: 600

# Generated by GitHub Copilot - Oct-05-2026
export:
  legacy_full_analysis: false
  chunk_records: 500
  chunk_max_bytes: 2097152

transcription:
  model: large-v3
  chunk_seconds: 240
  overlap_seconds: 4
  low_confidence: 0.60
  multipass: true
  max_review_regions: 100
  source_selection: auto
  glossary: ""
  # Em maquina NVIDIA, falha de CUDA deve aparecer como erro; nao cair silenciosamente para CPU.
  allow_cpu_fallback: false

audio:
  denoise: false
  normalize: true
  highpass_hz: 40
  separation: "off"
  # Para Demucs em ambiente separado: "C:/.../venv-demucs/Scripts/python.exe"
  demucs_python: null
  isolated_file: null
  isolated_offset_seconds: 0.0

diarization:
  enabled: true
  model: pyannote/speaker-diarization-community-1
  num_speakers: null

vision:
  enabled: true
  sample_fps: 2
  speech_sample_fps: 6
  checkpoint_seconds: 30
  max_width: 960
  body_backend: hog
  detector_cascade: true
  embedding_interval_seconds: 1.0
  body_refresh_seconds: 0.5
  track_occlusion_max_seconds: 2.0
  micro_reid_threshold: 0.72
  micro_reid_margin: 0.12
  micro_reid_threshold: 0.72
  micro_reid_margin: 0.12
  active_speaker: true
  manual_mapping_file: null
  # Generated by GitHub Copilot - Oct-05-2026
  tracklet_min_visual_seconds: 1.0
  tracklet_min_observations: 3
  identity_min_visual_seconds: 3.0
  reid_candidate_limit: 64

scenes:
  enabled: true
  threshold: 27
  min_seconds: 0.6

ocr:
  enabled: false
  languages: por+eng
  tesseract_cmd: null

audio_events:
  enabled: false
  checkpoint: null

semantic_analysis:
  enabled: true
  backend: ollama
  ollama_url: http://127.0.0.1:11434
  model: qwen3:14b
  profile: max
  chunk_seconds: 180
  timeout_seconds: 600
  max_chars: 24000
  keep_alive: 30m
  global_review: true
  global_max_moments: 120
  global_max_chars: 80000
  # Deixe null para usar o preset do profile. Max = ctx 32768 / predict 6144.
  num_ctx: null
  num_predict: null
  temperature: null
  top_k: null
  top_p: null
  repeat_penalty: null
  seed: null
  # Generated by GitHub Copilot - Oct-05-2026
  max_calls_per_hour: 80
  fallback_warning_fraction: 0.1

# Generated by GitHub Copilot - Oct-05-2026
understanding:
  participant_min_visual_seconds: 8.0
  participant_min_observations: 12
  participant_min_speech_seconds: 3.0
  participant_min_distinct_shots: 2
  hard_min_seconds: 8.0
  target_min_seconds: 30.0
  target_max_seconds: 90.0
  hard_max_seconds: 180.0
  allow_story_exception: true
  allow_commercial_candidates: false
  commercial_penalty: 0.5
  commercial_block_context_before_seconds: 25
  commercial_block_context_after_seconds: 25
  commercial_block_min_precursor_signals: 2
  commercial_block_context_before_seconds: 25
  commercial_block_context_after_seconds: 25
  commercial_block_min_precursor_signals: 2

captions:
  max_words: 5
  max_chars: 38
  max_seconds: 2.8
  uppercase_display: true

# O perfil define os defaults; overrides opcionais documentados em docs/CAMERA_DIRECTOR_V3.md.
camera_director:
  enabled: true
  dominant_face_fallback: true
  profile: natural
  debug_output: true


# Preview técnico de canários de risco. Não é o render social final.
preview:
  enabled: true
  max_canaries: 4
  canary_seconds: 8.0
  output_width: 540
  output_height: 960
  max_repair_iterations: 1

# Planejamento downstream para Curator; alterar isto nao exige refazer ASR/visao/semantica.
social_output:
  enabled: true
  aspect_ratio: "9:16"
  caption_preset: auto
  content_mode: auto
  caption_font: Arial
  caption_size_scale: 1.0
  caption_primary_color: "#FFFFFF"
  caption_highlight_color: "#F4FF26"
  title_auto: true
  smart_camera: true
  smart_zoom: true
  avoid_faces: true
  avoid_broadcast_graphics: true
  stories:
    enabled: true
    min_seconds: 15
    max_seconds: 60
    max_stories: 12
    min_spacing_seconds: 45
    max_per_topic: 2
    distribution_window_seconds: 600
    max_per_window: 3
